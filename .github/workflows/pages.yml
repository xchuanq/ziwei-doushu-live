name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack overlays, test, and build
        run: |
          unzip -q ziwei-doushu-optimized.zip -d /tmp/ziwei-source
          cd /tmp/ziwei-source/ziwei-doushu-optimized
          base64 -d "$GITHUB_WORKSPACE/ai-overlay-v2.b64" > /tmp/ai-overlay-v2.zip
          unzip -qo /tmp/ai-overlay-v2.zip -d /tmp/ziwei-source/ziwei-doushu-optimized
          base64 -d "$GITHUB_WORKSPACE/ai-overlay-v3.b64" > /tmp/ai-overlay-v3.zip
          unzip -qo /tmp/ai-overlay-v3.zip -d /tmp/ziwei-source/ziwei-doushu-optimized
          printf '\nexport const dynamic = "force-static";\n' >> app/robots.ts
          printf '\nexport const dynamic = "force-static";\n' >> app/sitemap.ts
          git init -q
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GITHUB_PAGES=true NEXT_PUBLIC_BASE_PATH="/$REPO_NAME" NEXT_PUBLIC_SITE_URL="https://$GITHUB_REPOSITORY_OWNER.github.io/$REPO_NAME" npm run build
          touch out/.nojekyll
          cp -R out "$GITHUB_WORKSPACE/site-out"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
